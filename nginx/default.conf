# ═══════════════════════════════════════════════════════════════════════════════
# nginx/default.conf — CentralGPS
# ═══════════════════════════════════════════════════════════════════════════════

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ─── SSE — Server-Sent Events (eventos de geocerca en tiempo real) ───────────
  # DEBE ir ANTES del bloque general de la API.
  #
  # proxy_buffering off  → CRITICO. Sin esto nginx acumula los eventos en
  #                        buffer y el cliente no los recibe en tiempo real.
  # proxy_read_timeout   → 3600s para no cortar conexiones SSE activas.
  # Connection: ''       → Necesario para HTTP/1.1 keep-alive con SSE.
  location /events/ {
    proxy_pass http://api:5000;
    proxy_http_version 1.1;

    proxy_buffering    off;
    proxy_cache        off;

    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_connect_timeout 30s;

    proxy_set_header Connection        '';
    proxy_set_header X-Accel-Buffering no;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ─── Proxy a la API ──────────────────────────────────────────────────────────
  location ~ ^/(auth|users|units|poi|pois|poi-groups|telemetry|monitor|catalogs|company|companies|clients|admin-erp|erp|eventos)(/|$) {
    proxy_pass http://api:5000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout    300s;
    proxy_connect_timeout 30s;
  }

  # ─── Health check del backend ────────────────────────────────────────────────
  location /health {
    proxy_pass http://api:5000/;
    proxy_set_header Host $host;
    access_log off;
  }

  # ─── SPA — archivos estaticos y fallback al index ────────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ─── Cache de assets con hash ────────────────────────────────────────────────
  location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}