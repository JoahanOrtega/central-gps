# ═══════════════════════════════════════════════════════════════════════════════
# nginx/security-headers.conf — Cabeceras de seguridad HTTP de CentralGPS
# ═══════════════════════════════════════════════════════════════════════════════
#
# ¿Por qué un snippet aparte y no directivas sueltas en default.conf?
#   add_header en nginx NO se hereda hacia un location que declare su propio
#   add_header (el bloque de cache de assets lo hace). Si las cabeceras
#   vivieran solo a nivel server, los .js y .css — justo los archivos más
#   sensibles a inyección — saldrían SIN protección, en silencio.
#   Con este snippet se incluye en ambos niveles sin duplicar texto.
#
# Se copia FUERA de /etc/nginx/conf.d/ a propósito: nginx auto-incluye todo
# *.conf de esa carpeta a nivel http, lo que duplicaría las cabeceras.
#
# `always` en cada directiva: sin él, nginx solo agrega la cabecera en
# respuestas 2xx/3xx — un 404 o 500 saldría desprotegido.

# Impide que el navegador "adivine" el MIME type. Sin esto, un archivo
# subido con extensión inocente pero contenido HTML/JS podría ejecutarse.
add_header X-Content-Type-Options "nosniff" always;

# Bloquea que terceros embeban la app en un iframe (clickjacking).
# SAMEORIGIN y no DENY: deja la puerta abierta a embeber la página
# pública de rastreo desde el propio dominio en el futuro.
add_header X-Frame-Options "SAMEORIGIN" always;

# En navegación hacia otros sitios solo se comparte el origen, nunca la
# ruta completa (que podría contener ?unidad=<id> u otros deep-links).
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# APIs del navegador que la app NO usa quedan negadas explícitamente.
# geolocation=(self): reservada al propio origen por si el rastreo
# público llegara a pedir la ubicación del espectador.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

# HSTS: obliga HTTPS por un año. En dev (http://localhost:8081) el
# navegador la IGNORA por diseño — solo tiene efecto sobre HTTPS, así
# que es inofensiva en local y protege en prod detrás de Cloudflare.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ─── Content-Security-Policy ──────────────────────────────────────────────────
# La cabecera más importante y la más delicada: lista blanca de orígenes
# por tipo de recurso. Ajustada específicamente para este stack:
#
#   script-src   → 'self' + maps.googleapis.com (loader del Maps JS API)
#                  + static.cloudflareinsights.com (beacon de Cloudflare
#                  Web Analytics, inyectado por Cloudflare en el HTML).
#   img-src      → tiles del mapa vienen de *.googleapis.com y *.gstatic.com;
#                  data:/blob: para los AdvancedMarkerElement e íconos SVG.
#   connect-src  → 'self' cubre la API y el WebSocket del mismo origen
#                  (CSP3: 'self' incluye ws/wss del propio host); wss: extra
#                  como red de seguridad para Safari viejos detrás del túnel.
#                  cloudflareinsights.com es el endpoint donde el
#                  beacon reporta sus mediciones (sin él, el script carga
#                  pero su POST sería bloqueado).
#   style-src    → 'unsafe-inline' es requerido: Google Maps inyecta
#                  estilos inline en sus elementos; React también los usa.
#                  fonts.googleapis.com por si se cargan Google Fonts.
#   worker-src   → blob: — Maps JS levanta workers desde blobs.
#   object-src   → 'none': nadie usa <object>/<embed>; vector clásico de XSS.
#   frame-ancestors → refuerzo moderno de X-Frame-Options (los navegadores
#                  actuales priorizan esta directiva).
#   script-src-attr → 'unsafe-inline' SOLO para atributos de manejador
#                  (onclick=...) que Google Maps inyecta en sus controles.
#                  No debilita script-src: los <script> inline y los
#                  scripts externos siguen bloqueados. React escapa HTML,
#                  así que inyectar un atributo requeriría un XSS previo.
# Si el navegador bloquea algo, la consola (F12) dice EXACTAMENTE qué
# directiva lo negó — ajustar aquí y rebuild.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://maps.googleapis.com https://static.cloudflareinsights.com; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.googleapis.com https://*.gstatic.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss: https://maps.googleapis.com https://cloudflareinsights.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;